name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC (06:17 in Nairobi): publishes posts whose date has
    # arrived and refreshes the Midweek Merchant fallback snapshot.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Blog checks (drafts, scheduling, feed, links)
        run: npm run test:blog
      - name: Build
        run: npm run build
        env:
          # Optional repository variables for a custom domain:
          # SITE_URL=https://example.com and BASE_PATH=/
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
