# Netlify builds main to production (portfolio.mosesmwai.engineer) and every
# pull request to a deploy preview. Settings here override the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12+, and scripts/snapshot-mm.mjs imports TypeScript directly.
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
